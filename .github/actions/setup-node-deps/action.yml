name: "Setup Node & Restore Dependencies"
description: "Checkout, setup Node.js, and restore cached monorepo dependencies. Reusable across all CI jobs."

inputs:
  node-version-file:
    description: "Path to .nvmrc"
    required: false
    default: ".nvmrc"
  cache-key:
    description: "Cache key output from setup job"
    required: true
  fetch-depth:
    description: "Git fetch depth"
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Restore Monorepo Dependencies
      uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: |
          node_modules
          backend/node_modules
          frontend/node_modules
          ~/.cache/prisma
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
