name: "Setup Node & Restore Dependencies"
description: "Checkout, setup Node.js, and restore cached monorepo dependencies. Reusable across all CI jobs."

inputs:
  node-version-file:
    description: "Path to .nvmrc"
    required: false
    default: ".nvmrc"
  cache-key:
    description: "Cache key output from setup job"
    required: true
  fetch-depth:
    description: "Git fetch depth"
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Restore Monorepo Dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          backend/node_modules
          frontend/node_modules
          ~/.cache/prisma
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
