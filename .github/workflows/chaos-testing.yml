name: Nightly Chaos Engineering Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: chaos-testing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chaos-test:
    name: Run Chaos Scenarios (Redis Outage, DB Latency, Backend Crash)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start Development Stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          echo "Waiting for services to initialize..."
          sleep 15

      - name: Run Chaos Test Suite
        run: |
          chmod +x ./scripts/ci/chaos-test.sh
          ./scripts/ci/chaos-test.sh all

      - name: Teardown Stack
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v
