name: Nightly Chaos Engineering Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: chaos-testing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chaos-test:
    name: Run Chaos Scenarios (Redis Outage, DB Latency, Backend Crash)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Start Development Stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          echo "Waiting for services to initialize..."
          sleep 15

      - name: Run Chaos Test Suite
        run: |
          chmod +x ./scripts/ci/chaos-test.sh
          ./scripts/ci/chaos-test.sh all

      - name: Teardown Stack
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v
