name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate-eol:
    name: Validate Line Endings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Check for CRLF line endings
        run: node scripts/validate-eol.js

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  setup:
    name: Monorepo — Prepare Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key-gen.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Generate Cache Key
        id: cache-key-gen
        run: |
          echo "key=${{ runner.os }}-monorepo-pnpm-${{ hashFiles('pnpm-lock.yaml', 'backend/prisma/schema.prisma') }}" >> $GITHUB_OUTPUT

      - name: Cache Node Modules & Prisma
        id: monorepo-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ steps.cache-key-gen.outputs.key }}

      - name: Install & Generate (On Cache Miss)
        if: steps.monorepo-cache.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter backend exec prisma generate

  nx-affected:
    name: Nx — Affected Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Nx Affected Tasks (Lint, Typecheck, Build)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          npx nx run-many -t lint typecheck build --affected --base=$BASE_SHA --parallel=3

  backend-test:
    name: Backend — Unit Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Unit tests + coverage
        working-directory: backend
        run: pnpm exec jest --coverage --ci --shard=${{ matrix.shard }}/3 --forceExit --passWithNoTests --detectOpenHandles

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/coverage/
          retention-days: 7

  backend-e2e:
    name: Backend — E2E Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [health, auth, posts, users]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: rootuser
      MINIO_SECRET_KEY: rootpassword
      MINIO_BUCKET: avatars
      MINIO_PUBLIC_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Run E2E tests (${{ matrix.module }})
        working-directory: backend
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --forceExit --detectOpenHandles --testTimeout=30000 test/${{ matrix.module }}.e2e-spec.ts

  backend-contract-test:
    name: Backend — API Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations & generate Prisma client
        working-directory: backend
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma generate

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Start backend server & run contract tests
        working-directory: backend
        run: |
          pnpm start:prod &
          SERVER_PID=$!
          npx wait-on http://localhost:3000/api/health/live --timeout 60000 --interval 1000
          node ../scripts/verify-api-contract.cjs
          node ../scripts/verify-pact-contracts.cjs
          kill $SERVER_PID || true
        env:
          NODE_ENV: test

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Unit tests + coverage
        working-directory: frontend
        run: pnpm exec vitest run --coverage --reporter=default --reporter=github-actions --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-prod-assessment:
    name: Frontend — Lighthouse & Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: setup
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Enforce bundle size budget
        run: node scripts/check-bundle-size.cjs

      - name: Check bundle size changes
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'frontend/dist/**/*.{js,css}'
          strip-hash: "\\b\\w{8}\\."
          build-script: "build"

  k8s-policy-check:
    name: Kubernetes Policy-as-Code Guardrails Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/verify-k8s-policies.cjs

  dependency-review:
    name: Dependency Review — Security & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency Review Action
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

  docker-build:
    name: Docker — Build, Scan & Cosign (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: frontend
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: social-network-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom-${{ matrix.service }}.cdx.json social-network-${{ matrix.service }}:ci-${{ github.sha }}

      - name: Sign SBOM & Provenance with Cosign
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            cosign sign-blob --yes --bundle cosign-${{ matrix.service }}-sbom.bundle sbom-${{ matrix.service }}.cdx.json || true
          fi

      - name: Upload SBOM and Cosign Signature Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-${{ matrix.service }}-provenance
          path: |
            sbom-${{ matrix.service }}.cdx.json
            cosign-${{ matrix.service }}-sbom.bundle
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-${{ matrix.service }}:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-${{ matrix.service }}.sarif --exit-code 0

      - name: Upload Trivy SARIF report
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}-image

  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validate-eol
      - commitlint
      - setup
      - nx-affected
      - backend-test
      - backend-e2e
      - backend-contract-test
      - k8s-policy-check
      - dependency-review
      - frontend-test
      - frontend-prod-assessment
      - docker-build
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        run: |
          python3 - << 'EOF'
          import json, sys

          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = [
            name for name, job in needs.items()
            if job["result"] not in ("success", "skipped")
          ]
          if failed:
            print(f"Failed jobs: {failed}")
            sys.exit(1)
          print("All CI checks passed ✅")
          EOF