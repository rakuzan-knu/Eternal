name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  preflight:
    name: Preflight — EOL & K8s Policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check for CRLF line endings
        run: node scripts/ci/validate-eol.js

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/ci/verify-k8s-policies.cjs

  plan:
    name: Plan — Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.sha.outputs.base }}
      backend-changed: ${{ steps.paths.outputs.backend }}
      frontend-changed: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Detect changed areas
        id: paths
        run: |
          BASE="${{ steps.sha.outputs.base }}"
          MB=$(git merge-base "$BASE" HEAD)
          git diff --name-only "$MB" HEAD > /tmp/changed.txt

          SHARED='^(pnpm-lock\.yaml|package\.json|nx\.json|tsconfig\.base\.json|\.github/workflows/ci\.yml)$'
          if grep -Eq "^(apps/backend/|backend/)|$SHARED" /tmp/changed.txt; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if grep -Eq "^(apps/web/|frontend/)|$SHARED" /tmp/changed.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Validate PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  setup:
    name: Monorepo — Prepare Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key-gen.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Generate Cache Key
        id: cache-key-gen
        run: |
          echo "key=${{ runner.os }}-monorepo-pnpm-v5-${{ hashFiles('pnpm-lock.yaml', 'apps/backend/prisma/schema.prisma') }}" >> $GITHUB_OUTPUT

      - name: Cache Node Modules & Prisma
        id: monorepo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ steps.cache-key-gen.outputs.key }}

      - name: Install Dependencies (On Cache Miss)
        if: steps.monorepo-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Native Packages & Generate Prisma
        run: |
          pnpm build:native
          pnpm --filter backend exec prisma generate

  nx-affected:
    name: Nx — Affected Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, plan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Nx task outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run Nx Affected Tasks (Lint, Typecheck, Build)
        run: |
          npx nx affected -t lint typecheck build --base=${{ needs.plan.outputs.base-sha }} --parallel=3

      - name: Run Knip (Unused Code & Dependency Analysis)
        run: pnpm knip

  backend-unit-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run backend unit tests
        if: github.event_name == 'pull_request'
        working-directory: apps/backend
        run: pnpm test:ci

      - name: Run backend unit tests with coverage (trunk)
        if: github.event_name != 'pull_request'
        working-directory: apps/backend
        run: pnpm test:cov:ci

      - name: Upload backend coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-unit-test-coverage
          path: apps/backend/coverage/
          retention-days: 7

  frontend-unit-tests:
    name: Frontend — Unit Tests (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run frontend unit tests (Shard ${{ matrix.shard }}/2)
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: pnpm test:ci -- --shard=${{ matrix.shard }}/2 --bail=1

      - name: Run frontend unit tests with coverage (trunk) (Shard ${{ matrix.shard }}/2)
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: pnpm test:cov:ci -- --shard=${{ matrix.shard }}/2

      - name: Upload frontend coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-test-coverage-${{ matrix.shard }}
          path: apps/web/coverage/
          retention-days: 7

  backend-e2e:
    name: Backend — E2E Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [health, auth, posts, users, chat, chat.socket]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: rootuser
      MINIO_SECRET_KEY: rootpassword
      MINIO_BUCKET: avatars
      MINIO_PUBLIC_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Run E2E tests (${{ matrix.module }})
        working-directory: apps/backend
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --forceExit --detectOpenHandles --testTimeout=30000 test/${{ matrix.module }}.e2e-spec.ts

  backend-contract-test:
    name: Backend — API Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Build backend
        working-directory: apps/backend
        run: pnpm build

      - name: Start backend server & run contract tests
        working-directory: apps/backend
        run: |
          pnpm start:prod &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health/live > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node ../../scripts/ci/verify-api-contract.cjs
          node ../../scripts/ci/verify-pact-contracts.cjs
          PACT_PROVIDER_URL=http://localhost:3000 pnpm test:pact:verify
          kill $SERVER_PID || true
        env:
          NODE_ENV: test

  frontend-e2e:
    name: Frontend — Playwright E2E (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite (Shard ${{ matrix.shard }}/2)
        working-directory: apps/web
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/2
        timeout-minutes: 15

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

  frontend-contract:
    name: Frontend — Pact Consumer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Pact consumer contract tests
        working-directory: apps/web
        run: pnpm test:contract

  frontend-prod-assessment:
    name: Frontend — Lighthouse & Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [setup, plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/backend/node_modules
            apps/web/node_modules
            packages/*/dist
            packages/*/node_modules
            packages/*/*/dist
            packages/*/*/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build frontend
        working-directory: apps/web
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Enforce bundle size budget
        run: node scripts/ci/check-bundle-size.cjs

      - name: Check bundle size changes
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'apps/web/dist/**/*.{js,css}'
          strip-hash: "\\b\\w{8}\\."
          build-script: "build"

  dependency-review:
    name: Dependency Review — Security & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review Action
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-ghsas: 'GHSA-fjxv-7rqg-78g4, GHSA-hmw2-7cc7-3qxx, GHSA-36jr-mh4h-2g58, GHSA-ggr8-5vv4-36mx, GHSA-3f6p-5ww8-9rcr, GHSA-7w5x-hrqm-74c2'
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

  docker-backend:
    name: Docker — Build & Scan (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: social-network-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Test container health (Smoke Test)
        run: |
          docker run -d --name backend-smoke \
            -e JWT_ACCESS_SECRET=ci_test_access_secret_key_32_bytes_min \
            -e JWT_REFRESH_SECRET=ci_test_refresh_secret_key_32_bytes_min \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            -e REDIS_URL=redis://localhost:6379 \
            social-network-backend:ci-${{ github.sha }}
          sleep 5
          docker logs backend-smoke || true
          docker stop backend-smoke || true
          docker rm -f backend-smoke || true

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom-backend.cdx.json social-network-backend:ci-${{ github.sha }}

      - name: Sign SBOM & Provenance with Cosign
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            cosign sign-blob --yes --bundle cosign-backend-sbom.bundle sbom-backend.cdx.json || true
          fi

      - name: Upload SBOM and Cosign Signature Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend-provenance
          path: |
            sbom-backend.cdx.json
            cosign-backend-sbom.bundle
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-backend:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-backend.sarif --exit-code 0

      - name: Upload Trivy SARIF report (image category)
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      - name: Upload Trivy SARIF report (root category)
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  docker-frontend:
    name: Docker — Build & Scan (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: social-network-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Test frontend container health (Smoke Test)
        run: |
          docker run -d --name frontend-smoke -p 8088:80 social-network-frontend:ci-${{ github.sha }}
          sleep 3
          curl -f http://localhost:8088/health || true
          docker stop frontend-smoke || true
          docker rm -f frontend-smoke || true

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom-frontend.cdx.json social-network-frontend:ci-${{ github.sha }}

      - name: Sign SBOM & Provenance with Cosign
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            cosign sign-blob --yes --bundle cosign-frontend-sbom.bundle sbom-frontend.cdx.json || true
          fi

      - name: Upload SBOM and Cosign Signature Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend-provenance
          path: |
            sbom-frontend.cdx.json
            cosign-frontend-sbom.bundle
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-frontend:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-frontend.sarif --exit-code 0

      - name: Upload Trivy SARIF report (image category)
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Upload Trivy SARIF report (root category)
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - commitlint
      - setup
      - plan
      - nx-affected
      - backend-unit-tests
      - frontend-unit-tests
      - backend-e2e
      - backend-contract-test
      - dependency-review
      - frontend-e2e
      - frontend-contract
      - frontend-prod-assessment
      - docker-backend
      - docker-frontend
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        run: |
          python3 - << 'EOF'
          import json, sys

          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = [
            name for name, job in needs.items()
            if job["result"] not in ("success", "skipped")
          ]
          if failed:
            print(f"Failed jobs: {failed}")
            sys.exit(1)
          print("All CI checks passed ✅")
          EOF