name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/test/**'
              - 'backend/prisma/**'
              - 'backend/package*.json'
              - 'backend/tsconfig*.json'
              - 'backend/eslint.config.mjs'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package*.json'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.ts'
              - 'frontend/vitest.config.ts'
              - 'frontend/eslint.config.js'
            docker:
              - '**/Dockerfile'
              - 'docker-compose*.yml'
              - '**/nginx.conf'
            ci:
              - '.github/workflows/**'
              - 'commitlint.config.js'

  validate-eol:
    name: Validate Line Endings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Check for CRLF line endings
        run: node scripts/validate-eol.js

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root deps
        run: npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Validate PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  setup:
    name: Monorepo — Prepare Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key-gen.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Generate Cache Key
        id: cache-key-gen
        run: |
          echo "key=${{ runner.os }}-monorepo-deps-${{ hashFiles('package-lock.json', 'backend/prisma/schema.prisma') }}" >> $GITHUB_OUTPUT

      - name: Cache Node Modules & Prisma & node-gyp
        id: monorepo-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ steps.cache-key-gen.outputs.key }}

      - name: Install & Generate (On Cache Miss)
        if: steps.monorepo-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
          cd backend && npx prisma generate

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Check formatting
        run: npm run format:check

  backend-lint:
    name: Backend — Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: backend/.eslintcache
          key: ${{ runner.os }}-backend-eslint-${{ hashFiles('backend/src/**/*.ts', 'backend/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-backend-eslint-

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

  backend-test:
    name: Backend — Unit Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Test Compiler (Backend)
        uses: actions/cache@v6
        with:
          path: backend/node_modules/.cache
          key: ${{ runner.os }}-backend-compiler-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-compiler-shard-${{ matrix.shard }}-

      - name: Unit tests + coverage
        working-directory: backend
        run: npm run test:cov -- --ci --shard=${{ matrix.shard }}/3 --forceExit --passWithNoTests --detectOpenHandles

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/coverage/
          retention-days: 7

  backend-e2e:
    name: Backend — E2E Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [health, auth, posts, users]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: rootuser
      MINIO_SECRET_KEY: rootpassword
      MINIO_BUCKET: avatars
      MINIO_PUBLIC_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run E2E tests (${{ matrix.module }})
        working-directory: backend
        run: npm run test:e2e -- test/${{ matrix.module }}.e2e-spec.ts --forceExit --passWithNoTests

  backend-contract-test:
    name: Backend — API Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations & generate Prisma client
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend server & run OpenAPI and Pact contract tests
        working-directory: backend
        run: |
          npm run start:prod &
          SERVER_PID=$!
          # Use /live endpoint — pure liveness probe, always 200 when the HTTP server is up
          # regardless of DB/Redis connectivity. Actual contract tests verify /api/health.
          npx wait-on http://localhost:3000/api/health/live --timeout 60000 --interval 1000
          node ../scripts/verify-api-contract.cjs
          node ../scripts/verify-pact-contracts.cjs
          kill $SERVER_PID || true
        env:
          NODE_ENV: test

  k8s-policy-check:
    name: Kubernetes Policy-as-Code Guardrails Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/verify-k8s-policies.cjs

  dependency-review:
    name: Dependency Review — Security & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  frontend-lint:
    name: Frontend — Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: frontend/.eslintcache
          key: ${{ runner.os }}-frontend-eslint-${{ hashFiles('frontend/src/**/*.ts', 'frontend/src/**/*.tsx', 'frontend/eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-frontend-eslint-

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Vitest Compiler (Frontend)
        uses: actions/cache@v6
        with:
          path: frontend/node_modules/.cache
          key: ${{ runner.os }}-frontend-compiler-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-compiler-

      - name: Unit tests + coverage
        working-directory: frontend
        run: npm run test:cov -- --passWithNoTests --reporter=default --reporter=github-actions --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-prod-assessment:
    name: Frontend — Lighthouse & Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, setup, frontend-lint]
    if: |
      github.event_name == 'pull_request' && 
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
            ~/.cache/node-gyp
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Enforce bundle size budget
        # Use .cjs extension — forces CJS loader regardless of root package.json "type":"module".
        # Eliminates Cannot find module error that occurs when preactjs/compressed-size-action
        # changes the module resolution context.
        run: node scripts/check-bundle-size.cjs

      - name: Check bundle size changes
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'frontend/dist/**/*.{js,css}'
          strip-hash: "\\b\\w{8}\\."
          build-script: "npm run build"

      - name: Run Lighthouse CI
        if: contains(github.event.pull_request.labels.*.name, 'lighthouse') || github.event_name == 'push'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  docker-build:
    name: Docker — Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: |
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: social-network-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-${{ matrix.service }}:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-${{ matrix.service }}.sarif --exit-code 0

      - name: Upload Trivy SARIF report
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}-image

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend-test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend-coverage

      - name: Post coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: frontend-coverage/coverage-summary.json
          name: Frontend Coverage

  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validate-eol
      - format-check
      - commitlint
      - setup
      - backend-lint
      - backend-test
      - backend-e2e
      - backend-contract-test
      - k8s-policy-check
      - dependency-review
      - frontend-lint
      - frontend-test
      - frontend-prod-assessment
      - docker-build
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        run: |
          python3 - << 'EOF'
          import json, sys

          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = [
            name for name, job in needs.items()
            if job["result"] not in ("success", "skipped")
          ]
          if failed:
            print(f"Failed jobs: {failed}")
            sys.exit(1)
          print("All CI checks passed ✅")
          EOF