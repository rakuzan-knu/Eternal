name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  preflight:
    name: Preflight — EOL & K8s Policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Check for CRLF line endings
        run: node scripts/validate-eol.js

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/verify-k8s-policies.cjs

  plan:
    name: Plan — Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.sha.outputs.base }}
      backend-changed: ${{ steps.paths.outputs.backend }}
      frontend-changed: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Detect changed areas
        id: paths
        run: |
          BASE="${{ steps.sha.outputs.base }}"
          MB=$(git merge-base "$BASE" HEAD)
          git diff --name-only "$MB" HEAD > /tmp/changed.txt

          SHARED='^(pnpm-lock\.yaml|package\.json|nx\.json|tsconfig\.base\.json|\.github/workflows/ci\.yml)$'
          if grep -Eq "^backend/|$SHARED" /tmp/changed.txt; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if grep -Eq "^frontend/|$SHARED" /tmp/changed.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Validate PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  setup:
    name: Monorepo — Prepare Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key-gen.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Generate Cache Key
        id: cache-key-gen
        run: |
          echo "key=${{ runner.os }}-monorepo-pnpm-${{ hashFiles('pnpm-lock.yaml', 'backend/prisma/schema.prisma') }}" >> $GITHUB_OUTPUT

      - name: Cache Node Modules & Prisma
        id: monorepo-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ steps.cache-key-gen.outputs.key }}

      - name: Install & Generate (On Cache Miss)
        if: steps.monorepo-cache.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter backend exec prisma generate

  nx-affected:
    name: Nx — Affected Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, plan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Nx task outputs
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run Nx Affected Tasks (Lint, Typecheck, Build)
        run: |
          npx nx run-many -t lint typecheck build --affected --base=${{ needs.plan.outputs.base-sha }} --parallel=3

  backend-unit-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run backend unit tests
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: pnpm test:ci

      - name: Run backend unit tests with coverage (trunk)
        if: github.event_name != 'pull_request'
        working-directory: backend
        run: pnpm test:cov:ci

      - name: Upload backend coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backend-unit-test-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-unit-tests:
    name: Frontend — Unit Tests (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run frontend unit tests (Shard ${{ matrix.shard }}/2)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: pnpm test:ci -- --shard=${{ matrix.shard }}/2 --bail=1

      - name: Run frontend unit tests with coverage (trunk) (Shard ${{ matrix.shard }}/2)
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: pnpm test:cov:ci -- --shard=${{ matrix.shard }}/2

      - name: Upload frontend coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-unit-test-coverage-${{ matrix.shard }}
          path: frontend/coverage/
          retention-days: 7

  backend-e2e:
    name: Backend — E2E Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [health, auth, posts, users, chat, chat.socket]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: rootuser
      MINIO_SECRET_KEY: rootpassword
      MINIO_BUCKET: avatars
      MINIO_PUBLIC_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Run E2E tests (${{ matrix.module }})
        working-directory: backend
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --forceExit --detectOpenHandles --testTimeout=30000 test/${{ matrix.module }}.e2e-spec.ts

  backend-contract-test:
    name: Backend — API Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d social_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/social_test
      DIRECT_URL: postgresql://user:password@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars-long
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Start backend server & run contract tests
        working-directory: backend
        run: |
          pnpm start:prod &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health/live > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node ../scripts/verify-api-contract.cjs
          node ../scripts/verify-pact-contracts.cjs
          PACT_PROVIDER_URL=http://localhost:3000 pnpm test:pact:verify
          kill $SERVER_PID || true
        env:
          NODE_ENV: test

  frontend-e2e:
    name: Frontend — Playwright E2E (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite (Shard ${{ matrix.shard }}/2)
        working-directory: frontend
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/2
        timeout-minutes: 15

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  frontend-contract:
    name: Frontend — Pact Consumer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Pact consumer contract tests
        working-directory: frontend
        run: pnpm test:contract

  frontend-prod-assessment:
    name: Frontend — Lighthouse & Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [setup, plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.frontend-changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Monorepo Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Enforce bundle size budget
        run: node scripts/check-bundle-size.cjs

      - name: Check bundle size changes
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'frontend/dist/**/*.{js,css}'
          strip-hash: "\\b\\w{8}\\."
          build-script: "build"

  dependency-review:
    name: Dependency Review — Security & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency Review Action
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

  docker-backend:
    name: Docker — Build & Scan (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, plan]
    if: needs.plan.outputs.backend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: social-network-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom-backend.cdx.json social-network-backend:ci-${{ github.sha }}

      - name: Sign SBOM & Provenance with Cosign
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            cosign sign-blob --yes --bundle cosign-backend-sbom.bundle sbom-backend.cdx.json || true
          fi

      - name: Upload SBOM and Cosign Signature Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-backend-provenance
          path: |
            sbom-backend.cdx.json
            cosign-backend-sbom.bundle
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-backend:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-backend.sarif --exit-code 0

      - name: Upload Trivy SARIF report
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

  docker-frontend:
    name: Docker — Build & Scan (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, plan]
    if: needs.plan.outputs.frontend-changed == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: social-network-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom-frontend.cdx.json social-network-frontend:ci-${{ github.sha }}

      - name: Sign SBOM & Provenance with Cosign
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            cosign sign-blob --yes --bundle cosign-frontend-sbom.bundle sbom-frontend.cdx.json || true
          fi

      - name: Upload SBOM and Cosign Signature Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-frontend-provenance
          path: |
            sbom-frontend.cdx.json
            cosign-frontend-sbom.bundle
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy_scanner
        run: |
          trivy image social-network-frontend:ci-${{ github.sha }} --severity CRITICAL,HIGH --format sarif -o trivy-frontend.sarif --exit-code 0

      - name: Upload Trivy SARIF report
        if: always() && steps.trivy_scanner.outcome == 'success'
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - commitlint
      - setup
      - plan
      - nx-affected
      - backend-unit-tests
      - frontend-unit-tests
      - backend-e2e
      - backend-contract-test
      - dependency-review
      - frontend-e2e
      - frontend-contract
      - frontend-prod-assessment
      - docker-backend
      - docker-frontend
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        run: |
          python3 - << 'EOF'
          import json, sys

          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = [
            name for name, job in needs.items()
            if job["result"] not in ("success", "skipped")
          ]
          if failed:
            print(f"Failed jobs: {failed}")
            sys.exit(1)
          print("All CI checks passed ✅")
          EOF