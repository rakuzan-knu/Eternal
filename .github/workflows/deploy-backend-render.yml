name: Deploy Backend to Render

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-backend-render-${{ github.ref }}
  cancel-in-progress: true

env:
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  IMAGE_REF: ghcr.io/${{ github.repository }}-backend:main

jobs:
  deploy:
    name: Verify Signature & Deploy Backend to Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Image Signature before Deployment
        run: |
          echo "🔒 Verifying Cosign image signature for ${IMAGE_REF}..."
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/.*" \
            "${IMAGE_REF}" || {
              echo "❌ Image verification failed! Refusing to deploy unsigned/untrusted image."
              exit 1
            }
          echo "✅ Image signature verified successfully."

      - name: Sync GitOps Secrets to Render
        if: env.RENDER_SERVICE_ID != '' && env.RENDER_API_KEY != ''
        env:
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ACCESS_TTL: ${{ secrets.JWT_ACCESS_TTL || '15m' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_TTL: ${{ secrets.JWT_REFRESH_TTL || '7d' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE || '1.0' }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET || 'avatars' }}
          MINIO_PUBLIC_URL: ${{ secrets.MINIO_PUBLIC_URL }}
        run: |
          chmod +x scripts/sync-render-secrets.sh
          ./scripts/sync-render-secrets.sh

      - name: Trigger Render Deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "🚀 Triggering deployment on Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Setup Node.js for Smoke Test
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Run Canary Smoke Test against Backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://social-network-backend-4h47.onrender.com' }}
          SMOKE_MAX_ATTEMPTS: 12
          SMOKE_DELAY_MS: 10000
        run: |
          echo "🧪 Running post-deploy canary smoke test..."
          node scripts/smoke-test-backend.js

      - name: Rollback Deployment on Failure
        if: failure() && env.RENDER_SERVICE_ID != '' && env.RENDER_API_KEY != ''
        run: |
          echo "🚨 Smoke test failed! Triggering rollback on Render..."
          curl -s -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json"

