name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/public/**'
      - 'vercel.json'

concurrency:
  group: deploy-frontend-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel — Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Build Frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://social-network-backend-4h47.onrender.com' }}

      - name: Deploy to Vercel (Staged Preview)
        id: vercel_stage
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: 'latest'
          working-directory: ./

      - name: Run Synthetic Smoke Test on Staged Deployment
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel_stage.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "🧪 Running synthetic smoke test against preview deployment: ${VERCEL_PREVIEW_URL}"
          node scripts/smoke-test-frontend.js

      - name: Promote Deployment to Production Apex
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest'
          working-directory: ./

