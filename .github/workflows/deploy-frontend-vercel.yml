name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/package*.json'
      - 'apps/web/vite.config.ts'
      - 'apps/web/public/**'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/public/**'
      - 'vercel.json'

concurrency:
  group: deploy-frontend-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel — Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Build Frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://social-network-backend-4h47.onrender.com' }}

      - name: Deploy to Vercel (Staged Preview)
        id: vercel_stage
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v25.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: 'latest'
          working-directory: ./

      - name: Run Synthetic Smoke Test on Staged Deployment
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel_stage.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "🧪 Running synthetic smoke test against preview deployment: ${VERCEL_PREVIEW_URL}"
          node scripts/deploy/smoke-test-frontend.js

      - name: Promote Deployment to Production Apex
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v25.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest'
          working-directory: ./

