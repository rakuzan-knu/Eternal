name: Deploy Smoke Test

# Black-box smoke test against the deployed Render backend. Free-tier
# services sleep when idle; the script warms the service up before asserting,
# so the generous timeout is intentional. Runs on a cadence and on demand.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the deployed backend'
        required: false
        default: 'https://social-network-backend-4h47.onrender.com'

permissions: read-all

concurrency:
  group: deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — Deployed Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Run smoke tests
        run: node scripts/smoke-deployed-backend.cjs "${{ github.event.inputs.target_url || 'https://social-network-backend.onrender.com' }}"
