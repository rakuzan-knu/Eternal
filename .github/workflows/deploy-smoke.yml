name: Deploy Smoke Test

# Black-box smoke test against the deployed Render backend. Free-tier
# services sleep when idle; the script warms the service up before asserting,
# so the generous timeout is intentional. Runs on a cadence and on demand.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the deployed backend'
        required: false
        default: 'https://social-network-backend-4h47.onrender.com'

permissions: read-all

concurrency:
  group: deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — Deployed Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run smoke tests
        run: node scripts/deploy/smoke-deployed-backend.cjs "${{ github.event.inputs.target_url || 'https://social-network-backend-4h47.onrender.com' }}"
