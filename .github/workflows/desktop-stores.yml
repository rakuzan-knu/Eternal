name: Desktop store packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable desktop release (v1.2.3)
        required: false
        type: string
      candidate_version:
        description: Non-publishing candidate from protected main (1.2.3); leave tag empty
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-stores-${{ inputs.tag || inputs.candidate_version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify stable release source on the protected branch
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          STABLE_ONLY: 'true'
        run: node apps/desktop/scripts/release-source.ts
      - name: Require an existing stable desktop release
        if: steps.source.outputs.publish == 'true'
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$TAG" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$SOURCE_COMMIT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' | grep -qx true
          mkdir release-source
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-source --pattern desktop-release.json --pattern SHA256SUMS --pattern 'Eternal-*-linux-*.deb'
          (cd release-source && sha256sum --check SHA256SUMS --ignore-missing)
          gh attestation verify release-source/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh attestation verify release-source/desktop-release.json --repo "$GITHUB_REPOSITORY"
          jq -e --arg tag "$TAG" --arg commit "$commit" '.tag == $tag and .version == ($tag | ltrimstr("v")) and .commit == $commit' release-source/desktop-release.json
          test -s "release-source/Eternal-${TAG#v}-linux-amd64.deb"
          test -s "release-source/Eternal-${TAG#v}-linux-arm64.deb"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.source.outputs.publish == 'true'
        with:
          name: desktop-store-source
          path: release-source/
          retention-days: 7
          if-no-files-found: error

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: msix
            arch: x64
          - runner: windows-latest
            target: msix
            arch: arm64
          - runner: ubuntu-latest
            target: snap
            arch: x64
          - runner: ubuntu-24.04-arm
            target: snap
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: |
          printf '\nsupportedArchitectures:\n  cpu: [x64, arm64]\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
      - name: Set up isolated Snapcraft build provider
        if: matrix.target == 'snap'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic
          if ! snap list lxd > /dev/null 2>&1; then sudo snap install lxd; fi
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          for firewall in iptables ip6tables; do
            if sudo "$firewall" -S DOCKER-USER > /dev/null 2>&1; then
              sudo "$firewall" -C DOCKER-USER -i lxdbr0 -j ACCEPT 2> /dev/null ||
                sudo "$firewall" -I DOCKER-USER -i lxdbr0 -j ACCEPT
              sudo "$firewall" -C DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2> /dev/null ||
                sudo "$firewall" -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            fi
          done
      - name: Validate and build
        run: |
          pnpm --filter @eternal/desktop lint
          pnpm --filter @eternal/desktop test --maxWorkers=2
          pnpm build:desktop
      - name: Use the host Windows SDK for MakeAppx
        if: matrix.target == 'msix'
        shell: pwsh
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $kit = Get-ChildItem $kitsRoot -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64/makeappx.exe') } |
            Select-Object -First 1
          if (-not $kit) { throw 'The x64 runner requires a host Windows SDK with MakeAppx' }
          $kitPath = Join-Path $kit.FullName 'x64'
          "ELECTRON_BUILDER_WINDOWS_KITS_PATH=$kitPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package without uploading to stores
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          ETERNAL_DESKTOP_STORE_IDENTITY: ${{ vars.ETERNAL_DESKTOP_STORE_IDENTITY }}
          ETERNAL_DESKTOP_STORE_PUBLISHER: ${{ vars.ETERNAL_DESKTOP_STORE_PUBLISHER }}
          ETERNAL_DESKTOP_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.ETERNAL_DESKTOP_STORE_PUBLISHER_DISPLAY_NAME }}
          ETERNAL_DESKTOP_SNAP_NAME: ${{ vars.ETERNAL_DESKTOP_SNAP_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          if [ "$TARGET" = snap ]; then
            sg lxd -c 'pnpm --filter @eternal/desktop package snap "--$ARCH" --version "$VERSION"'
          else
            pnpm --filter @eternal/desktop package "$TARGET" "--$ARCH" --version "$VERSION"
          fi
      - name: Verify license materials inside MSIX
        if: matrix.target == 'msix'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem apps/desktop/release -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSIX package' }
          $inspection = Join-Path $env:RUNNER_TEMP 'eternal-msix-license-inspection'
          $licenses = Join-Path $inspection 'licenses'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          $names = @((Get-ChildItem apps/desktop/build/licenses -File).Name) + @('Eternal-LICENSE.md')
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            foreach ($name in $names) {
              $entry = $archive.GetEntry("app/resources/licenses/$name")
              if (-not $entry) { throw "MSIX license material missing: $name" }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $licenses $name), $true)
            }
          } finally { $archive.Dispose() }
          pnpm --filter @eternal/desktop exec node scripts/native-license-source.ts verify-package $inspection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify license materials inside Snap
        if: matrix.target == 'snap'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          packages=(apps/desktop/release/*.snap)
          test "${#packages[@]}" -eq 1
          inspection="$RUNNER_TEMP/eternal-snap-license-inspection-$ARCH"
          unsquashfs -no-xattrs -d "$inspection" "${packages[0]}" app/resources/licenses
          pnpm --filter @eternal/desktop exec node scripts/native-license-source.ts verify-package "$inspection/app/resources"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-store-${{ needs.prepare.outputs.publish == 'false' && 'candidate-' || '' }}${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.msix
            apps/desktop/release/*.snap
          if-no-files-found: error
          retention-days: 7
      - name: Collect Snap build diagnostics
        if: failure() && matrix.target == 'snap'
        run: |
          sudo lxc network list
          sudo iptables -S FORWARD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() && matrix.target == 'snap'
        with:
          name: desktop-store-snap-diagnostics-${{ matrix.arch }}
          path: |
            ~/.local/state/snapcraft/log/*.log
            apps/desktop/release/__snap-*/snap/snapcraft.yaml
          if-no-files-found: warn
          retention-days: 7
