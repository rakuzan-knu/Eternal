name: Automated DR Failover Drill

on:
  schedule:
    - cron: '0 4 */14 * *' # Bi-weekly automated DR drill
  workflow_dispatch:

concurrency:
  group: dr-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dr-drill:
    name: DR Failover Drill & RTO Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Execute Automated Failover Drill
        run: node scripts/execute-dr-failover.cjs --dry-run
        env:
          DR_MODE: 'offline_verification'
