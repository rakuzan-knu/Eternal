name: Automated DR Failover Drill

on:
  schedule:
    - cron: '0 4 */14 * *' # Bi-weekly automated DR drill
  workflow_dispatch:

concurrency:
  group: dr-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dr-drill:
    name: DR Failover Drill & RTO Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Execute Automated Failover Drill
        run: node scripts/deploy/execute-dr-failover.cjs --dry-run
        env:
          DR_MODE: 'offline_verification'
