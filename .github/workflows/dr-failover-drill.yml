name: Automated DR Failover Drill

on:
  schedule:
    - cron: '0 4 */14 * *' # Bi-weekly automated DR drill
  workflow_dispatch:

concurrency:
  group: dr-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dr-drill:
    name: DR Failover Drill & RTO Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Execute Automated Failover Drill
        run: node scripts/execute-dr-failover.cjs --dry-run
        env:
          DR_MODE: 'offline_verification'
