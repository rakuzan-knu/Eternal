name: Performance Benchmarks & Regression Detection

on:
  push:
    branches: [main, develop]
  schedule:
    # Nightly regression detection; too heavy to gate every PR.
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: API Latency & Query Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run CI Performance Benchmarks
        run: node scripts/ci/verify-performance-benchmarks.cjs
