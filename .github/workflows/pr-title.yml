name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            style
            test
            perf
            ci
            revert
          scopes: |
            auth
            feed
            chat
            profile
            user
            post
            follow
            media
            ws
            infra
            deps
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: 'Заголовок PR не должен превышать 100 символов и должен соответствовать Conventional Commits'
