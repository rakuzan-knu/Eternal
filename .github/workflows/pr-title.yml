name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            style
            test
            perf
            ci
            revert
            optimization
          scopes: |
            auth
            feed
            chat
            profile
            user
            post
            follow
            media
            ws
            infra
            deps
            security
            backend
            frontend
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: 'The PR title must not exceed 100 characters and must comply with Conventional Commits'
