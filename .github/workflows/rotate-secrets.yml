name: Automated Secrets Rotation

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly rotation on 1st day of month
  workflow_dispatch:

concurrency:
  group: rotate-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate Application & Storage Encryption Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Execute Secret Rotation
        run: node scripts/secrets/rotate-secrets.cjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
