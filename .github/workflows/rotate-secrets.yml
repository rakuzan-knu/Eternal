name: Automated Secrets Rotation

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly rotation on 1st day of month
  workflow_dispatch:

concurrency:
  group: rotate-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate Application & Storage Encryption Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Execute Secret Rotation
        run: node scripts/secrets/rotate-secrets.cjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
