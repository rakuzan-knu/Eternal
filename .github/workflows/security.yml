name: Security

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run pnpm audit
        run: |
          pnpm audit --prod --audit-level=high --json > audit-report.json || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat audit-report.json | node -e "
            const fs=require('fs');
            try {
              const d=fs.readFileSync(0,'utf8');
              const r=JSON.parse(d);
              const meta = r.metadata?.vulnerabilities || {};
              if (meta.critical !== undefined) {
                console.log(meta.critical);
              } else {
                const adv = r.advisories || {};
                console.log(Object.values(adv).filter(v=>v.severity==='critical').length);
              }
            } catch(e) { console.log(0); }
          " || echo "0")

          HIGH=$(cat audit-report.json | node -e "
            const fs=require('fs');
            try {
              const d=fs.readFileSync(0,'utf8');
              const r=JSON.parse(d);
              const meta = r.metadata?.vulnerabilities || {};
              if (meta.high !== undefined) {
                console.log(meta.high);
              } else {
                const adv = r.advisories || {};
                console.log(Object.values(adv).filter(v=>v.severity==='high').length);
              }
            } catch(e) { console.log(0); }
          " || echo "0")

          echo "### 🛡️ Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Found | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" -gt "0" ]; then
            echo "| 🔴 Critical | $CRITICAL | ❌ Failed (Fix immediately) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔴 Critical | 0 | ✅ Clear |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🟠 High | $HIGH | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY

          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "Found $CRITICAL critical vulnerability/ies. Failing build."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-audit-report
          path: audit-report.json
          retention-days: 30

  trivy-fs:
    name: Trivy — Filesystem Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/security.yml') }}
          restore-keys: |
            ${{ runner.os }}-trivy-


      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy Filesystem Scan
        id: trivy_fs_step
        run: |
          trivy fs . --severity CRITICAL,HIGH --ignore-unfixed --format sarif -o trivy-fs.sarif --exit-code 0


      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && steps.trivy_fs_step.outcome == 'success'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  gitleaks:
    name: Gitleaks — Baseline Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action with Baseline Config
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: TruffleHog — Entropy Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@3bcf19f51e91a9655d84ddb623728c7620be482a # main
        with:
          path: ./
          extra_args: --debug --only-verified

  k8s-policy-check:
    name: Policy-as-Code — K8s Guardrails Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/ci/verify-k8s-policies.cjs


