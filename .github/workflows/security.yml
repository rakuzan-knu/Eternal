name: Security

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high --json > audit-report.json || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat audit-report.json | node -e "
            const fs=require('fs');
            try {
              const d=fs.readFileSync(0,'utf8');
              const r=JSON.parse(d);
              const meta = r.metadata?.vulnerabilities || {};
              if (meta.critical !== undefined) {
                console.log(meta.critical);
              } else {
                const adv = r.advisories || {};
                console.log(Object.values(adv).filter(v=>v.severity==='critical').length);
              }
            } catch(e) { console.log(0); }
          " || echo "0")

          HIGH=$(cat audit-report.json | node -e "
            const fs=require('fs');
            try {
              const d=fs.readFileSync(0,'utf8');
              const r=JSON.parse(d);
              const meta = r.metadata?.vulnerabilities || {};
              if (meta.high !== undefined) {
                console.log(meta.high);
              } else {
                const adv = r.advisories || {};
                console.log(Object.values(adv).filter(v=>v.severity==='high').length);
              }
            } catch(e) { console.log(0); }
          " || echo "0")

          echo "### 🛡️ Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Found | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" -gt "0" ]; then
            echo "| 🔴 Critical | $CRITICAL | ❌ Failed (Fix immediately) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔴 Critical | 0 | ✅ Clear |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🟠 High | $HIGH | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY

          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "Found $CRITICAL critical vulnerability/ies. Failing build."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pnpm-audit-report
          path: audit-report.json
          retention-days: 30

  trivy-fs:
    name: Trivy — Filesystem Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Trivy DB
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/security.yml') }}
          restore-keys: |
            ${{ runner.os }}-trivy-


      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy Filesystem Scan
        id: trivy_fs_step
        run: |
          trivy fs . --severity CRITICAL,HIGH --format sarif -o trivy-fs.sarif --exit-code 0


      - uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always() && steps.trivy_fs_step.outcome == 'success'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  gitleaks:
    name: Gitleaks — Baseline Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action with Baseline Config
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: TruffleHog — Entropy Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@96b593f460badf7a3da2ad3487e0e4986243ef03 # main
        with:
          path: ./
          extra_args: --debug --only-verified

  k8s-policy-check:
    name: Policy-as-Code — K8s Guardrails Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/verify-k8s-policies.cjs


