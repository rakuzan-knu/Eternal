name: Security

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  npm-audit:
    name: npm audit — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Run npm audit (Lockfile only)
        run: |
          npm audit --workspace=${{ matrix.workspace }} --audit-level=high --package-lock-only --json > ${{ matrix.workspace }}/audit-report.json || true

      - name: Check for critical vulnerabilities
        working-directory: ${{ matrix.workspace }}
        run: |
          CRITICAL=$(cat audit-report.json | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf8');
            const r=JSON.parse(d);
            const vulns = r.vulnerabilities || {};
            const critical = Object.values(vulns).filter(v=>v.severity==='critical').length;
            console.log(critical);
          " 2>/dev/null || echo "0")

          HIGH=$(cat audit-report.json | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf8');
            const r=JSON.parse(d);
            const vulns = r.vulnerabilities || {};
            const high = Object.values(vulns).filter(v=>v.severity==='high').length;
            console.log(high);
          " 2>/dev/null || echo "0")

          echo "### 🛡️ Security Audit Summary for \`${{ matrix.workspace }}\`" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Found | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" -gt "0" ]; then
            echo "| 🔴 Critical | $CRITICAL | ❌ Failed (Fix immediately) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔴 Critical | 0 | ✅ Clear |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🟠 High | $HIGH | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY

          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "Found $CRITICAL critical vulnerability/ies. Failing build."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/audit-report.json
          retention-days: 30

  trivy-fs:
    name: Trivy — Filesystem Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/security.yml') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy Filesystem Scan
        id: trivy_fs_step
        run: |
          trivy fs . --severity CRITICAL,HIGH --format sarif -o trivy-fs.sarif --exit-code 0


      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy_fs_step.outcome == 'success'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  gitleaks:
    name: Gitleaks — Baseline Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action with Baseline Config
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: TruffleHog — Entropy Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@96b593f460badf7a3da2ad3487e0e4986243ef03 # main
        with:
          path: ./
          extra_args: --debug --only-verified

  k8s-policy-check:
    name: Policy-as-Code — K8s Guardrails Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run K8s Policy-as-Code verification script
        run: node scripts/verify-k8s-policies.cjs


