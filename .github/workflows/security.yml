name: Security

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  npm-audit:
    name: npm audit — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run npm audit (Lockfile only)
        run: |
          npm audit --workspace=${{ matrix.workspace }} --audit-level=high --package-lock-only --json > ${{ matrix.workspace }}/audit-report.json || true

      - name: Check for critical vulnerabilities
        working-directory: ${{ matrix.workspace }}
        run: |
          CRITICAL=$(cat audit-report.json | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf8');
            const r=JSON.parse(d);
            const vulns = r.vulnerabilities || {};
            const critical = Object.values(vulns).filter(v=>v.severity==='critical').length;
            console.log(critical);
          " 2>/dev/null || echo "0")

          HIGH=$(cat audit-report.json | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf8');
            const r=JSON.parse(d);
            const vulns = r.vulnerabilities || {};
            const high = Object.values(vulns).filter(v=>v.severity==='high').length;
            console.log(high);
          " 2>/dev/null || echo "0")

          echo "### 🛡️ Security Audit Summary for \`${{ matrix.workspace }}\`" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Found | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" -gt "0" ]; then
            echo "| 🔴 Critical | $CRITICAL | ❌ Failed (Fix immediately) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔴 Critical | 0 | ✅ Clear |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🟠 High | $HIGH | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY

          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "Found $CRITICAL critical vulnerability/ies. Failing build."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/audit-report.json
          retention-days: 30

  trivy-fs:
    name: Trivy — Filesystem Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/security.yml') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - uses: aquasecurity/trivy-action@v0.36.0
        id: trivy_fs_step
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.trivy_fs_step.outcome == 'success'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  gitleaks:
    name: Gitleaks — Incremental Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
