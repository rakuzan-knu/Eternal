name: Storybook

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/package*.json'

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check if stories exist
        id: stories-check
        run: |
          COUNT=$(git ls-files | grep -E '\.stories\.(ts|tsx)$' | wc -l || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT story files"

      - name: Skip execution if no stories
        if: steps.stories-check.outputs.count == '0'
        run: |
          echo "No .stories.ts(x) files found — skipping environment setup and build."
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache Storybook Build Compiler
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Build Storybook
        working-directory: frontend
        run: npm run build:storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: frontend/storybook-static/
          retention-days: 3
