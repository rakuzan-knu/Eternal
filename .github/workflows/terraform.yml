name: GitOps Infrastructure (Terraform)

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Free Tier Infrastructure Plan & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infrastructure/terraform

    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN || 'dummy_token' }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN || 'dummy_token' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.7.0'

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Run Infrastructure Unit Test Suite
        run: node ../../scripts/ci/verify-terraform.cjs

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Import Existing Vercel Project if Present
        if: env.VERCEL_API_TOKEN != 'dummy_token' && env.VERCEL_API_TOKEN != ''
        run: |
          terraform import vercel_project.social_network_frontend[0] social-network || true

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          PLAN_OUT=$(terraform plan -no-color -out=tfplan 2>&1)
          PLAN_EXIT_CODE=$?
          {
            echo "PLAN_OUT<<EOF"
            echo "$PLAN_OUT"
            echo "EOF"
          } >> $GITHUB_ENV
          exit $PLAN_EXIT_CODE
        continue-on-error: true

      - name: Post Plan Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan Status: \`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan Result</summary>

            \`\`\`hcl
            ${process.env.PLAN_OUT || 'Plan executed successfully.'}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status Check
        if: steps.plan.outcome == 'failure' && env.VERCEL_API_TOKEN != 'dummy_token'
        run: |
          echo "❌ Terraform Plan failed!"
          exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.plan.outcome == 'success' && env.VERCEL_API_TOKEN != 'dummy_token'
        run: terraform apply -auto-approve tfplan
