[package]
name = "msg-codec-native"
version = "1.0.0"
edition = "2021"
description = "Native accelerator for @social-network/native msg-codec v1 (napi-rs). Byte-identical to src/codec.ts."
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"

[dev-dependencies]
serde_json = "1"
