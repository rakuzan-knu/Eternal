[package]
name = "text-pipeline-native"
version = "1.0.0"
edition = "2021"
description = "Native accelerator for @social-network/text-pipeline v1 (napi-rs). Behavior-identical to the TS core; vectors/v1.json is the shared contract."
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"
serde_json = "1"
