packages:
  - 'apps/backend'
  - 'apps/web'
  - 'apps/mobile'
  - 'packages/*'
  - 'packages/shared/*'

# These libraries import React types without declaring their peer dependency.
# Keep web React 19 types separate from the native React 18 workspace.
packageExtensions:
  'react-native-safe-area-context@4':
    peerDependencies:
      '@types/react': '^18.2.6'
  'lucide-react-native@0.475.0':
    peerDependencies:
      '@types/react': '^18.2.6'
  '@storybook/react@8':
    peerDependencies:
      '@types/react': '*'
  '@storybook/react-vite@8':
    peerDependencies:
      '@types/react': '*'
  '@tanstack/react-query@5':
    peerDependencies:
      '@types/react': '*'
  'react-router@7':
    peerDependencies:
      '@types/react': '*'
  'react-router-dom@7':
    peerDependencies:
      '@types/react': '*'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@swc/core'
  - 'argon2'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'msw'
  - 'nx'
  - 'prisma'
  - 'unrs-resolver'

