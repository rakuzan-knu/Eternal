  'minimatch@9>brace-expansion': '^2.1.7'
  'minimatch@10>brace-expansion': '^5.0.12'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@3': '^3.0.6'
