  '@xmldom/xmldom': '>=0.8.15'
  axios: '>=1.20.0'
  compression: '>=1.8.2'
  shell-quote: '>=1.11.0'
  fastify: '>=5.12.6'
  'undici@6': '^6.29.1'
  'undici@7': '^7.30.2'
  'undici@6.28.0': '6.29.1'
  'undici@7.29.0': '7.30.2'
  js-yaml: '>=5.4.2'
  uuid: ^11.1.1
  multer: '>=2.5.0'
  fast-uri: '>=4.2.3'
  sharp: '>=0.35.4'
