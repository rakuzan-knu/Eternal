# yaml-language-server: $schema=none
services:
  - type: web
    name: social-network-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: 'production'
      - key: AUTO_MIGRATE
        value: 'true'
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: '15m'
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_TTL
        value: '7d'
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '1.0'
      # Cloudflare R2 Object Storage (Zero local media stored on Render)
      - key: STORAGE_DRIVER
        value: 'r2'
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: 'social-network'
      - key: MINIO_PUBLIC_URL
        sync: false
    # Secrets synced automatically via GitOps script scripts/secrets/sync-render-secrets.sh
    # or optional Environment Group binding:
    # envVarGroups:
    #   - name: social-network-production-secrets
